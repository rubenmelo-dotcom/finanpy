{% comment %}
  Lista de categorias de uma coluna (entradas ou saídas).
  Uso: {% include 'categories/_category_items.html' with categories=income_categories only %}
{% endcomment %}
<ul class="divide-y divide-line" role="list">
  {% for category in categories %}
    <li class="flex items-center justify-between gap-3 py-3">
      <div class="flex min-w-0 items-center gap-3">
        <span class="h-2 w-2 shrink-0 rounded-full" style="background-color: {{ category.color }}" aria-hidden="true"></span>
        <span class="truncate text-sm font-medium text-ink" title="{{ category.name }}">{{ category.name }}</span>
      </div>
      <div class="flex shrink-0 gap-2">
        <a href="{% url 'categories:update' category.pk %}" class="btn-ghost btn-sm" aria-label="Editar categoria {{ category.name }}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
          </svg>
          <span class="hidden sm:inline">Editar</span>
        </a>
        <a href="{% url 'categories:delete' category.pk %}" class="btn-ghost btn-sm" aria-label="Excluir categoria {{ category.name }}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
          <span class="hidden sm:inline">Excluir</span>
        </a>
      </div>
    </li>
  {% endfor %}
</ul>
