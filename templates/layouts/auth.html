{% extends 'base.html' %}

{% block body %}
  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12 bg-[radial-gradient(ellipse_at_top,_rgba(139,92,246,0.18),_transparent_60%)]">
    <a href="{% url 'home' %}" class="mb-8 text-3xl font-bold tracking-tight text-gradient rounded-lg focus:outline-hidden focus-visible:ring-2 focus-visible:ring-brand-500">Finanpy</a>

    <main id="main" class="card max-w-md w-full">
      <div class="mb-6 text-center">
        <h1 class="text-2xl md:text-3xl font-semibold text-ink">{% block auth_title %}{% endblock %}</h1>
        <p class="mt-1 text-sm text-ink-muted">{% block auth_subtitle %}{% endblock %}</p>
      </div>

      {% include 'components/_messages.html' %}

      {% block content %}{% endblock %}
    </main>

    <div class="mt-6 text-center text-sm text-ink-muted">
      {% block auth_footer %}{% endblock %}
    </div>
  </div>
{% endblock %}
