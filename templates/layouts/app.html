{% extends 'base.html' %}

{% block body %}
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] btn-primary">Pular para o conteúdo</a>

  {% include 'components/_sidebar.html' %}

  <div id="drawer-overlay" class="fixed inset-0 z-40 bg-black/60 hidden lg:hidden" aria-hidden="true"></div>

  <div class="min-h-screen bg-base text-ink lg:pl-64">
    {% include 'components/_topbar.html' %}

    <main id="main" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6 md:py-8" tabindex="-1">
      {% include 'components/_messages.html' %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      var sidebar = document.getElementById('app-sidebar');
      var overlay = document.getElementById('drawer-overlay');
      var toggle = document.getElementById('drawer-toggle');
      if (!sidebar || !overlay || !toggle) return;
      var focusTimer = null;

      function focusables() {
        return Array.prototype.filter.call(
          sidebar.querySelectorAll('a[href], button:not([disabled])'),
          function (el) { return el.offsetParent !== null; }
        );
      }

      function focusFirst() {
        var navItem = sidebar.querySelector('nav a.nav-link[href]') ||
          sidebar.querySelector('a.nav-link[href]');
        if (navItem && navItem.offsetParent !== null) {
          navItem.focus();
          return;
        }
        var items = focusables();
        if (items.length) items[0].focus();
      }

      function isOpen() {
        return toggle.getAttribute('aria-expanded') === 'true';
      }

      function setOpen(open) {
        window.clearTimeout(focusTimer);
        sidebar.classList.toggle('-translate-x-full', !open);
        sidebar.classList.toggle('translate-x-0', open);
        sidebar.classList.toggle('invisible', !open);
        sidebar.classList.toggle('visible', open);
        overlay.classList.toggle('hidden', !open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
        if (open) {
          /* A sidebar só fica focável depois que a transição de
             visibility começa; tenta no próximo frame e garante no fim. */
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(focusFirst);
          });
          focusTimer = window.setTimeout(function () {
            if (isOpen() && !sidebar.contains(document.activeElement)) {
              focusFirst();
            }
          }, 250);
        } else {
          toggle.focus();
        }
      }

      toggle.addEventListener('click', function () { setOpen(!isOpen()); });
      overlay.addEventListener('click', function () { setOpen(false); });
      sidebar.querySelectorAll('[data-drawer-close]').forEach(function (btn) {
        btn.addEventListener('click', function () { setOpen(false); });
      });
      document.addEventListener('keydown', function (event) {
        if (!isOpen()) return;
        if (event.key === 'Escape') {
          setOpen(false);
          return;
        }
        if (event.key !== 'Tab') return;
        var items = focusables();
        if (!items.length) return;
        var first = items[0];
        var last = items[items.length - 1];
        var active = document.activeElement;
        if (!sidebar.contains(active)) {
          event.preventDefault();
          (event.shiftKey ? last : first).focus();
        } else if (event.shiftKey && active === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && active === last) {
          event.preventDefault();
          first.focus();
        }
      });
    })();
  </script>
{% endblock %}
