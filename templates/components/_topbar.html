{% comment %}
  Topbar mobile (abaixo de 'lg') com logo e botão hambúrguer (PRD 9.11).
{% endcomment %}
<header class="sticky top-0 z-30 flex items-center justify-between bg-base/80 backdrop-blur border-b border-line px-4 h-16 lg:hidden">
  <a href="{% url 'dashboard' %}" class="text-xl font-bold tracking-tight text-gradient rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500">Finanpy</a>
  <button
    type="button"
    id="drawer-toggle"
    class="btn-ghost btn-sm"
    aria-label="Abrir menu"
    aria-controls="app-sidebar"
    aria-expanded="false"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>
</header>
